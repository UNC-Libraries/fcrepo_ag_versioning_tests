services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: fcrepo
      POSTGRES_PASSWORD: fcrepo
      POSTGRES_DB: postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fcrepo -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  fcrepo5:
    image: fcrepo/fcrepo:5.1.1-multiplatform
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8085:8080"
    environment:
      CATALINA_OPTS: >-
        -Dfcrepo.modeshape.configuration=file:/config/repository.json
        -Dfcrepo.postgresql.host=postgres
        -Dfcrepo.postgresql.port=5432
        -Dfcrepo.postgresql.username=fcrepo
        -Dfcrepo.postgresql.password=fcrepo
        -Dfcrepo.binary.directory=/data/binaries
        -Dfcrepo.external.content.allowed=/config/allowed-external-content.txt
    volumes:
      - ./docker/fcrepo5/repository.json:/config/repository.json:ro
      - ./docker/allowed-external-content.txt:/config/allowed-external-content.txt:ro
      - ./test_bins:/external
      - ./docker-data/fcrepo5:/data

  fcrepo6:
    image: fcrepo/fcrepo:6.5.2-tomcat9
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8086:8080"
    environment:
      CATALINA_OPTS: -Dfcrepo.config.file=/config/fcrepo.properties
    volumes:
      - ./docker/fcrepo6/fcrepo.properties:/config/fcrepo.properties:ro
      - ./docker/allowed-external-content.txt:/config/allowed-external-content.txt:ro
      - ./test_bins:/external
      - ./docker-data/fcrepo6:/data

  fcrepo7:
    image: fcrepo/fcrepo:7.0.0-tomcat10
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8087:8080"
    environment:
      CATALINA_OPTS: -Dfcrepo.config.file=/config/fcrepo.properties
    volumes:
      - ./docker/fcrepo7/fcrepo.properties:/config/fcrepo.properties:ro
      - ./docker/allowed-external-content.txt:/config/allowed-external-content.txt:ro
      - ./test_bins:/external
      - ./docker-data/fcrepo7:/data

volumes:
  postgres-data:
